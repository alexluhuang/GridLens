[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpack-workbench"
version = "0.1.0"
description = "Local desktop GUI for running GridPACK contingency analysis through Docker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "GridPACK Workbench Contributors" }
]
dependencies = [
  "PySide6>=6.6,<7"
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8",
  "pandas>=2.2"
]
dev = [
  "pytest>=8",
  "pyinstaller>=6"
]

[project.scripts]
gridpack-workbench = "gridpack_workbench.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridpack_workbench = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
