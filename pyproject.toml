[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridlens"
version = "0.1.0"
description = "Local desktop GUI for running GridPACK contingency analysis through Docker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [
  { name = "GridLens Contributors" }
]
keywords = ["gridpack", "contingency-analysis", "docker", "power-systems", "qt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "PySide6>=6.6,<7",
  "mcp==1.30.0",
  "psutil>=5.9"
]

# RAPIDS publishes Linux wheels only, so its packages carry a Linux marker and a
# Windows install gets the CPU analysis stack alone. numpy, pandas, pyarrow, and
# Dask stay at the versions RAPIDS 26.6 installs on Linux, so every platform runs
# the same analysis libraries; upgrade them together with RAPIDS.
[project.optional-dependencies]
analysis-cpu = [
  "matplotlib>=3.8",
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<2.4",
  "dask[dataframe]==2026.1.1",
  "distributed==2026.1.1",
  "pyarrow>=15,<24"
]
# The CPU stack, and RAPIDS for CUDA 13, which needs NVIDIA driver 580 or later.
analysis = [
  "matplotlib>=3.8",
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<2.4",
  "dask[dataframe]==2026.1.1",
  "distributed==2026.1.1",
  "pyarrow>=15,<24",
  "cuda-toolkit>=13.3,<14; sys_platform == 'linux'",
  "cudf-cu13==26.6.*; sys_platform == 'linux'",
  "cupy-cuda13x>=14.1,<15; sys_platform == 'linux'",
  "dask-cuda==26.6.*; sys_platform == 'linux'",
  "dask-cudf-cu13==26.6.*; sys_platform == 'linux'",
  "numba-cuda>=0.28; sys_platform == 'linux'",
  "nvidia-nccl-cu13>=2.27,<3; sys_platform == 'linux'"
]
# The CPU stack, and RAPIDS for CUDA 12, for NVIDIA drivers older than 580.
analysis-cu12 = [
  "matplotlib>=3.8",
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<2.4",
  "dask[dataframe]==2026.1.1",
  "distributed==2026.1.1",
  "pyarrow>=15,<24",
  "cuda-toolkit>=12.9,<13; sys_platform == 'linux'",
  "cudf-cu12==26.6.*; sys_platform == 'linux'",
  "cupy-cuda12x>=14.1.1,<15; sys_platform == 'linux'",
  "dask-cuda==26.6.*; sys_platform == 'linux'",
  "dask-cudf-cu12==26.6.*; sys_platform == 'linux'",
  "numba-cuda>=0.28; sys_platform == 'linux'",
  "nvidia-nccl-cu12>=2.27,<3; sys_platform == 'linux'"
]
dev = [
  "pytest>=8",
  "pyinstaller>=6"
]

[project.scripts]
gridlens = "gridlens.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridlens = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
