name: Deploy GridLens Frontend To GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_GRIDLENS_API_BASE_URL: ${{ vars.VITE_GRIDLENS_API_BASE_URL }}
          VITE_GRIDLENS_AUTH_MODE: ${{ vars.VITE_GRIDLENS_AUTH_MODE }}
          VITE_GRIDLENS_COGNITO_DOMAIN: ${{ vars.VITE_GRIDLENS_COGNITO_DOMAIN }}
          VITE_GRIDLENS_COGNITO_CLIENT_ID: ${{ vars.VITE_GRIDLENS_COGNITO_CLIENT_ID }}
          VITE_PUBLIC_BASE_PATH: ${{ vars.VITE_PUBLIC_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
