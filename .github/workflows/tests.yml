# Unit tests on the platforms GridLens supports, and a Windows bundle build.
#
# The runners have no NVIDIA GPU, so the tests install the CPU analysis stack
# (the analysis-cpu extra); GPU analysis and the Docker sandbox are checked on
# a DGX Spark or another NVIDIA machine, with the opt-in tests described in
# docs/developer_guide.md.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt's system libraries and zstd
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 zstd
      - name: Install GridLens with the CPU analysis stack
        run: python -m pip install -e ".[dev,analysis-cpu]"
      - name: Run the tests
        run: python -m pytest

  windows-bundle:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GridLens with the analysis stack
        run: python -m pip install -e ".[dev,analysis]"
      - name: Render the icon
        run: python packaging/windows/make_icon.py build/gridlens.ico
      - name: Build the bundle
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/gridlens.spec
      - name: Start the console helper
        shell: pwsh
        run: |
          # With no job folder, the worker entry point prints its usage and
          # exits with code 2, which proves the executable starts.
          & dist\GridLens\gridlens-cli.exe --agent-job
          if ($LASTEXITCODE -ne 2) { exit 1 }
          exit 0
